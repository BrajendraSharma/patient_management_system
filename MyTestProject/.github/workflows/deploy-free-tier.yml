name: Deploy to Staging (Free Tier)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.ref == 'refs/heads/dev'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish API for Linux
      run: dotnet publish MyTestProject/Implimentation/patient_management_system/ClinicalPatientManagement/ClinicalPatientManagement.Api/ClinicalPatientManagement.Api.csproj -c ${{ env.BUILD_CONFIGURATION }} -r linux-x64 -o ./deploy/api

    - name: Publish Blazor Client
      run: dotnet publish MyTestProject/Implimentation/patient_management_system/ClinicalPatientManagement/ClinicalPatientManagement.Client/ClinicalPatientManagement.Client.csproj -c ${{ env.BUILD_CONFIGURATION }} -o ./deploy/client

    - name: Create Docker image for API (optional for Render)
      uses: docker/setup-buildx-action@v3

    - name: Create deployment package
      run: |
        cd deploy
        zip -r api-release.zip api/
        zip -r client-release.zip client/

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-package
        path: deploy/

    - name: Deploy to Render (if RENDER_DEPLOY_HOOK is set)
      if: secrets.RENDER_DEPLOY_HOOK != ''
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

    - name: Deploy notification
      run: |
        echo "## Deployment Information" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Build completed for Linux x64" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifacts available for download" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Options (Free Tier):" >> $GITHUB_STEP_SUMMARY
        echo "1. **Render.com** - Set RENDER_DEPLOY_HOOK secret to auto-deploy" >> $GITHUB_STEP_SUMMARY
        echo "2. **Railway.app** - Download artifacts and deploy via Railway CLI" >> $GITHUB_STEP_SUMMARY
        echo "3. **Fly.io** - Download artifacts and deploy via Fly CLI" >> $GITHUB_STEP_SUMMARY
        echo "4. **GitHub Codespaces** - Run locally for testing" >> $GITHUB_STEP_STEP_SUMMARY

  verify-build:
    runs-on: ubuntu-latest
    needs: deploy-render
    
    steps:
    - name: Download API artifacts
      uses: actions/download-artifact@v3
      with:
        name: deployment-package

    - name: Verify deployment artifacts
      run: |
        echo "API files:"
        ls -la api/
        echo ""
        echo "Client files:"
        ls -la client/

    - name: Deployment summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Deployment package ready" >> $GITHUB_STEP_SUMMARY
        echo "✅ API: Located in 'deploy/api'" >> $GITHUB_STEP_SUMMARY
        echo "✅ Client: Located in 'deploy/client'" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "- Download the deployment package from artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Follow the free-tier deployment guide in STEP17_DEVOPS_GUIDE.md" >> $GITHUB_STEP_SUMMARY
