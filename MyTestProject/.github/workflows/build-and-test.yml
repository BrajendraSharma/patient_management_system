name: Build and Test

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPassword123!
          MSSQL_PID: Express
        options: >-
          --health-cmd="/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPassword123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1433:1433

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Wait for SQL Server to be ready
      run: |
        for i in {1..30}; do
          if dotnet tool install -g dotnet-sqlserver && sqlcmd -S localhost -U sa -P TestPassword123! -Q "SELECT 1" > /dev/null 2>&1; then
            echo "SQL Server is ready"
            exit 0
          fi
          echo "Waiting for SQL Server... ($i/30)"
          sleep 2
        done
        echo "SQL Server failed to start"
        exit 1

    - name: Run unit tests
      run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost;Database=ClinicalPatientManagement_Test;User Id=sa;Password=TestPassword123!;"

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-reports
        path: '**/coverage.cobertura.xml'

    - name: Publish code coverage
      uses: codecov/codecov-action@v3
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
        verbose: true

  build-web:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Web API
      run: dotnet publish MyTestProject/Implimentation/patient_management_system/ClinicalPatientManagement/ClinicalPatientManagement.Api/ClinicalPatientManagement.Api.csproj -c ${{ env.BUILD_CONFIGURATION }} -o api-release

    - name: Publish Blazor Client
      run: dotnet publish MyTestProject/Implimentation/patient_management_system/ClinicalPatientManagement/ClinicalPatientManagement.Client/ClinicalPatientManagement.Client.csproj -c ${{ env.BUILD_CONFIGURATION }} -o client-release

    - name: Upload API artifacts
      uses: actions/upload-artifact@v3
      with:
        name: api-release
        path: api-release/

    - name: Upload Client artifacts
      uses: actions/upload-artifact@v3
      with:
        name: client-release
        path: client-release/

    - name: Create release summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Build Configuration: ${{ env.BUILD_CONFIGURATION }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ .NET Version: ${{ env.DOTNET_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ API Published: api-release/" >> $GITHUB_STEP_SUMMARY
        echo "✅ Blazor Client Published: client-release/" >> $GITHUB_STEP_SUMMARY
